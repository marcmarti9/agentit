name: Audit evidence

on:
  push:
    branches:
      - "audit/**"

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture source snapshots
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/commit.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/evidence/source.tar.gz"
      - name: Install test dependency
        run: python -m pip install PyYAML
      - name: Capture test baseline
        shell: bash
        run: |
          set +e
          python -m unittest discover -s router -p 'test_*.py' -v > "$RUNNER_TEMP/evidence/router-tests.txt" 2>&1
          router_status=$?
          python -m unittest discover -s tests -p 'test_*.py' -v > "$RUNNER_TEMP/evidence/script-tests.txt" 2>&1
          script_status=$?
          printf '{"router_exit":%s,"scripts_exit":%s}\n' "$router_status" "$script_status" > "$RUNNER_TEMP/evidence/test-status.json"
          cat "$RUNNER_TEMP/evidence/test-status.json"
      - name: Upload inspectable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 7
      - name: Enforce test status
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'evidence/test-status.json').read_text())
          assert result == {'router_exit': 0, 'scripts_exit': 0}, result
          PY
