schema_version: 1
policy:
  default: intelligent
  specialist_spawn_requires_benefit: true
  provider_neutral: true
  graceful_degradation_to_parent: true
  interview_only_for_unresolved_material_decisions: true
  interview_one_question_at_a_time: true
  semantic_complexity_owned_by_primary_ai: true
  continuity_for_substantial_work: true
  continuity_policy: docs/PROJECT_CONTINUITY.md
  pr_first_repository_changes: true
  direct_default_branch_requires_explicit_override: true
  no_hard_subagent_caps: true
  critic_required_for_large_structural_plans: true
  no_powerwords_required: true
  one_writer_per_file: true
  parent_integrates: true
  max_parallel_design_concepts: 3
  notes: |
    Specialists are model-readable capability bundles, not a mandatory org chart and not provider-specific dependencies.
    The primary AI owns semantic task interpretation, complexity, selected packs/skills/references/tools, topology, and verification.
    Catalog triggers are discovery hints only; deterministic software must never use them as a natural-language router.
    There are no fixed pack-depth tiers, skill counts, or worker quotas. Delegation must earn its coordination/context cost.
    If the host cannot spawn a preferred specialist, use a host-native bounded worker or the parent with the same selected skill bodies.
    When genuine independence is required for safety or review, degrade visibly and escalate rather than pretending same-context review is independent.

specialists:
  - id: frontend-developer
    domain: engineering
    mode: implementer
    description: Production frontend implementation, component architecture, responsive behavior, accessibility, and browser polish.
    triggers: [frontend, react, nextjs, ui implementation, responsive, component]
    skills: [frontend-ui-engineering, browser-testing-with-devtools, performance-optimization]
    capabilities:
      required: [repository.read, filesystem.read, filesystem.write]
      preferred: [design.inspect, browser.inspect, browser.automate, documentation.read]
    output: implementation receipt with files changed, browser evidence, tests, and remaining issues

  - id: backend-architect
    domain: engineering
    mode: probe
    description: API boundaries, service decomposition, data flow, reliability, and backend architecture decisions.
    triggers: [backend architecture, api design, service boundary, data model, distributed system]
    skills: [api-and-interface-design, observability-and-instrumentation, security-and-hardening]
    capabilities:
      required: [repository.read, documentation.read]
      preferred: [database.read, observability.read]
    output: architecture recommendation with tradeoffs, interfaces, risks, and verification plan

  - id: ai-engineer
    domain: engineering
    mode: implementer
    description: LLM, RAG, and agent workflows, evaluation, tool use, model integration, and failure handling.
    triggers: [llm, rag, agents, embeddings, model api, tool calling]
    skills: [source-driven-development, architect-orchestrator, verification-before-completion]
    capabilities:
      required: [repository.read, filesystem.read, filesystem.write, runtime.execute]
      preferred: [documentation.read, data.analyze]
    output: implementation or design with eval criteria, failure modes, and cost/latency notes

  - id: devops-automator
    domain: engineering
    mode: implementer
    description: CI/CD, deployment automation, containers, release workflows, and operational reproducibility.
    triggers: [ci, cd, deployment, docker, github actions, infrastructure]
    skills: [ci-cd-and-automation, shipping-and-launch, observability-and-instrumentation]
    capabilities:
      required: [repository.read, filesystem.write, runtime.execute]
      preferred: [deployment.inspect, deployment.manage, observability.read]
    output: automation changes plus dry-run/test evidence and rollback notes

  - id: trend-researcher
    domain: product
    mode: probe
    description: Current market, product, design, and technology trend research with source-backed synthesis.
    triggers: [trend, current market, emerging, inspiration, benchmark]
    skills: [source-driven-development, design-trend-researcher]
    capabilities:
      required: [documentation.read]
      preferred: [data.analyze, design.inspect]
    output: concise trend map separating emerging, maturing, saturated, and speculative patterns

  - id: feedback-synthesizer
    domain: product
    mode: probe
    description: Cluster user feedback, repeated pain points, contradictions, and actionable product hypotheses.
    triggers: [user feedback, reviews, interviews, complaints, feature requests]
    skills: [idea-refine, interview-me, documentation-and-adrs]
    capabilities:
      required: [documentation.read, data.analyze]
      preferred: [issue.read, collaboration.read]
    output: themes, evidence, tensions, hypotheses, and prioritized opportunities

  - id: sprint-prioritizer
    domain: product
    mode: reviewer
    description: Prioritize work by impact, evidence, dependency, effort, risk, and reversibility.
    triggers: [prioritize, sprint, roadmap, backlog]
    skills: [planning-and-task-breakdown, spec-driven-development]
    capabilities:
      required: [issue.read, documentation.read]
      preferred: [data.analyze]
    output: ranked plan with rationale, dependencies, cuts, and explicit non-goals

  - id: executive-strategist
    domain: executive
    mode: probe
    description: Company-level strategy, market choice, positioning, moats, build/buy/partner decisions and strategic sequencing.
    triggers: [company strategy, positioning, market entry, moat, partnership, build vs buy, strategic priority]
    skills: [executive-strategy, reference-intelligence, source-driven-development]
    capabilities:
      required: [documentation.read]
      preferred: [data.analyze, collaboration.read]
    output: strategic recommendation with alternatives, explicit non-goals, assumptions, evidence and revisit criteria

  - id: finance-executive
    domain: executive
    mode: probe
    description: Cash, runway, unit economics, scenarios, ROI, pricing economics and capital-allocation judgment.
    triggers: [cash, runway, unit economics, pricing, roi, budget, margin, capital allocation, fundraising]
    skills: [executive-finance, context-engineering, doubt-driven-development]
    capabilities:
      required: [documentation.read, data.analyze]
      preferred: [collaboration.read]
    output: decision-oriented financial model with assumptions, scenarios, sensitivities and exposure/review limits

  - id: people-executive
    domain: executive
    mode: probe
    description: Role design, hiring, compensation, performance, retention and organization-structure decisions.
    triggers: [hiring, compensation, performance, retention, org design, management span, role design]
    skills: [executive-people, reference-intelligence]
    capabilities:
      required: [documentation.read]
      preferred: [data.analyze, collaboration.read]
    output: people recommendation with business rationale, human impact, evidence, jurisdiction risks and follow-up criteria

  - id: legal-executive
    domain: executive
    mode: reviewer
    description: Executive legal framing for contracts, IP, employment, privacy, governance and regulatory exposure with jurisdiction-aware escalation.
    triggers: [contract, legal risk, ip, privacy, employment law, regulation, governance, dispute]
    skills: [executive-legal, reference-intelligence, doubt-driven-development]
    capabilities:
      required: [documentation.read]
      preferred: [collaboration.read]
    output: issue/risk map, current-source requirements, negotiating options and explicit qualified-counsel escalation boundary

  - id: operations-executive
    domain: executive
    mode: probe
    description: Constraint, process, vendor, automation, capacity and operating-metric decisions.
    triggers: [operations, process, bottleneck, vendor, automation, capacity, sla, workflow]
    skills: [executive-operations, planning-and-task-breakdown]
    capabilities:
      required: [documentation.read]
      preferred: [data.analyze, issue.read, collaboration.read]
    output: constraint-first operating recommendation with owner, metric, fallback and review point

  - id: marketing-executive
    domain: executive
    mode: probe
    description: ICP, positioning, GTM, funnel/channel economics, brand/demand and retention-linked marketing decisions.
    triggers: [gtm, icp, positioning, channel strategy, funnel, marketing roi, brand, launch]
    skills: [executive-marketing, marketing-and-growth, reference-intelligence]
    capabilities:
      required: [documentation.read]
      preferred: [data.analyze, browser.inspect, collaboration.read]
    output: prioritized GTM/marketing decision tied to customer behavior, economics, evidence and experiment thresholds

  - id: product-executive
    domain: executive
    mode: probe
    description: Customer-problem, product-market-fit, roadmap, sequencing, make/buy and evidence-gate decisions.
    triggers: [product strategy, pmf, roadmap, prioritization, make vs buy, customer problem, retention]
    skills: [executive-product, reference-intelligence]
    capabilities:
      required: [documentation.read]
      preferred: [data.analyze, issue.read, collaboration.read]
    output: product judgment with riskiest assumption, evidence gate, sequencing, success signal and kill/revisit condition

  - id: board-executive
    domain: executive
    mode: reviewer
    description: Board/investor narrative, KPI/variance, governance, material risk and explicit decision/ask preparation.
    triggers: [board, investor update, board deck, governance, board metrics, board ask]
    skills: [executive-board, executive-finance, executive-legal]
    capabilities:
      required: [documentation.read]
      preferred: [data.analyze, collaboration.read]
    output: coherent board-level narrative or review with reconciled numbers, material risks, recommendation and explicit asks

  - id: executive-chief-of-staff
    domain: executive
    mode: probe
    description: Triage company signals, maintain decision/follow-up queues, route ownership and compress operating cadence without executive-notification spam.
    triggers: [chief of staff, triage, executive priorities, blockers, follow up, decision queue, operating cadence]
    skills: [executive-chief-of-staff, executive-orchestration, planning-and-task-breakdown]
    capabilities:
      required: [documentation.read]
      preferred: [issue.read, collaboration.read, data.analyze]
    output: compact triage/decision queue with owners, urgency rationale, blockers, next action and closure condition

  - id: design-system-researcher
    domain: design
    mode: probe
    description: Query product-aware UI/UX intelligence JIT and return compact baselines for style, typography, color, UX, charts, icons, motion, and stack guidance.
    triggers: [design system, ui patterns, ux patterns, palette, typography, product style, chart design, ui ux pro max]
    skills: [ui-ux-pro-max, source-driven-development]
    capabilities:
      required: [documentation.read]
      preferred: [design.inspect]
    output: compact design-intelligence brief with queries/evidence, recommended baselines, alternatives, anti-patterns, and missing-result notes

  - id: ui-researcher
    domain: design
    mode: probe
    description: Research current interfaces and visual references, extracting reusable principles instead of cloning examples.
    triggers: [design inspiration, visual references, ui research, redesign]
    skills: [design-inspiration-research, design-trend-researcher, source-driven-development]
    capabilities:
      required: [documentation.read]
      preferred: [design.inspect, browser.inspect]
    output: reference board in text form with patterns, anti-patterns, transferable principles, and source links

  - id: creative-tool-scout
    domain: design
    mode: probe
    description: Find current libraries, creative tools, shaders, motion systems, 3D tooling, and implementation primitives for a chosen concept.
    triggers: [which library, creative tooling, shader, webgl, animation tool, implementation technique]
    skills: [creative-tool-scout, source-driven-development]
    capabilities:
      required: [documentation.read]
      preferred: [design.inspect, browser.inspect]
    output: recommended tool stack with alternatives, maturity, tradeoffs, integration cost, and proof links

  - id: visual-storytelling-director
    domain: design
    mode: probe
    description: Turn content and brand intent into a paced visual narrative with deliberate reveals, transitions, rests, climax, and interaction rhythm.
    triggers: [storytelling, cinematic, narrative, campaign, immersive landing, brand experience]
    skills: [visual-storytelling-director, creative-web-experiences, design-taste-frontend]
    capabilities:
      required: [documentation.read]
      preferred: [design.inspect, design.edit]
    output: beat sheet, scene/state map, interaction grammar, and rationale

  - id: spatial-experience-designer
    domain: design
    mode: probe
    description: Design guided or explorable spatial web experiences such as stores, museums, exhibitions, rooms, and virtual showrooms.
    triggers: [virtual store, showroom, museum, spatial, 3d environment, walkthrough]
