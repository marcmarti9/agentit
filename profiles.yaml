    description: 'Deep company-level executive bench: strategy, finance, people, legal, operations,
      marketing, product, board and chief-of-staff judgment. Deliberately broad for installation/discovery;
      each task still selects only the exact executive skill bodies, evidence and specialists it needs
      JIT.'
