schema_version: 1
default_profile: core
global_profiles:
- core
profiles:
  core:
    description: 'Minimal global Agentit bootstrap: decide whether Agentit is warranted, choose a domain
      pack, then load task skills JIT. Core also carries the minimum durable-documentation and cold-session
      invariants.'
