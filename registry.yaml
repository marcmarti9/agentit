schema_version: 1
purpose: "Portable compact inventory and routing metadata; descriptions are not skill bodies."
defaults:
  load_mode: progressive_disclosure
  compression: disabled_until_selected
  risk_floor: preserve_inferred_risk
  unknowns: stop_and_inspect
providers:
  - id: codex-cli
    executable_names: ["codex"]
    target_roots:
      - "${HOME}/.codex"
    expected_status: ACTIVE_GLOBAL
    notes: "Resolve the executable from PATH; expected status is policy, not detected availability."
  - id: claude-code
    executable_names: ["claude"]
    target_roots:
      - "${HOME}/.claude"
    expected_status: ACTIVE_GLOBAL
    notes: "Resolve the executable from PATH; expected status is policy, not detected availability."
  - id: antigravity-cli
    executable_names: ["antigravity", "gemini"]
    target_roots:
      - "${HOME}/.gemini/antigravity-cli"
      - "${HOME}/.agents"
    expected_status: ACTIVE_GLOBAL
    notes: "Resolve the first available executable from PATH; Gemini may provide the compatible entrypoint."
  - id: opencode
    executable_names: ["opencode"]
    target_roots:
      - "${HOME}/.opencode"
    expected_status: AVAILABLE_ON_DEMAND
    notes: "Resolve the executable from PATH when selected; the catalog does not assert installation."
entries:
  - id: local-security-hardening
    name: "Local shell and MCP permission hardening"
    kind: script
    category: security
    provenance: local-repository
    paths:
      - "${REPO_ROOT}/security/harden-local.sh"
    trigger: "explicit local security hardening or permission audit"
    avoid_when: "unknown HOME, symlinked config, or request to alter credentials/proxy"
    context_cost: low
    execution_cost: low
    depth: shallow
    risk: medium
    conflicts: ["user-managed aliases", "provider-specific secret stores"]
    dependencies: ["bash, find, awk, sha256sum"]
    essential_dependencies: []
    required_tools: []
    compression_applied: none
    reversibility: high
    state: ACTIVE_GLOBAL
    priority: core

  - id: adaptive-agent-architecture
    name: "Adaptive loop-and-graph orchestration"
    kind: architecture
    category: orchestration
    provenance: origin-main
    source_ref: "origin/main@eab20ca"
    paths:
      - "${REPO_ROOT}/docs/ADAPTIVE_AGENT_ARCHITECTURE.md"
      - "${REPO_ROOT}/skills/architect-orchestrator/SKILL.md"
    trigger: "task routing, delegation, graph ownership, bounded loops, or independent audit"
    avoid_when: "focused task with no context-isolation or parallelism benefit"
    context_cost: low_if_index_only
    execution_cost: medium_when_delegating
    depth: adaptive
    risk: medium_to_high
    conflicts: ["fixed hierarchy treated as mandatory", "unbounded fan-out"]
    dependencies: ["provider subagent runtime only when selected"]
    essential_dependencies: []
    required_tools: []
    compression_applied: none
    reversibility: high
    state: ACTIVE_GLOBAL
    priority: core

  - id: architect-orchestrator
    name: "Adaptive orchestration guidance"
    kind: skill-and-agents
    category: orchestration
    provenance: local-repository
    paths:
      - "${REPO_ROOT}/skills/architect-orchestrator"
      - "${HOME}/.codex/skills/architect-orchestrator"
      - "${HOME}/.agents/skills/architect-orchestrator"
      - "${HOME}/.claude/skills/architect-orchestrator"
    trigger: "multidomain task, explicit delegation, or critical independent review"
    avoid_when: "trivial or single-line task"
    context_cost: medium
    execution_cost: medium
    depth: deep
    risk: medium
    conflicts: ["duplicate orchestration methodologies"]
    dependencies: []
    essential_dependencies: []
    required_tools: ["provider subagents, if delegation is justified"]
    compression_applied: none
    reversibility: high
    state: ACTIVE_GLOBAL
    priority: core

