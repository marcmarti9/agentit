    description: Core plus browser, performance, UI maintenance, and development-security guidance. Installation/discovery
      only; runtime selection remains JIT, but security implications are part of the standing development
      bar and app-security-gate becomes mandatory when the change exposes or modifies a meaningful application
      attack surface.
