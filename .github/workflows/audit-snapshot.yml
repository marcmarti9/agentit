name: Audit source snapshot

on:
  push:
    branches: [audit/repository-cleanup-2026-09-07]
    paths: [.github/workflows/audit-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked files only
        run: git archive --format=tar HEAD -o "$RUNNER_TEMP/agentit-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: agentit-audit-source
          path: ${{ runner.temp }}/agentit-source.tar
          retention-days: 1
          if-no-files-found: error
