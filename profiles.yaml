      - mobile-native-app-design
  mobile:
    description: "Expo/React Native product UI: study shipped mobile winners, then implement native-feeling screens. Installation/discovery bundle only; workers still load the selected skill JIT."
    extends:
      - frontend
    skills:
      - mobile-native-app-design
      - anti-ai-slop-design
      - design-inspiration-research
  release:
    description: "Core plus CI, migration, launch, and operational readiness."
    extends:
      - core
    skills:
      - ci-cd-and-automation
      - deprecation-and-migration
      - shipping-and-launch
      - documentation-and-adrs
      - verification-before-completion
  research:
    description: "Core plus context, specifications, authoritative source work, and adversarial review."
    extends:
      - core
    skills:
      - context-engineering
      - source-driven-development
      - doubt-driven-development
      - spec-driven-development
      - verification-before-completion
  growth:
    description: "Digital growth delivery on demand: product discovery, CRO, copy, SEO signals and launch discipline. Live marketing data still requires separately reviewed connectors."
    extends:
      - product
    skills:
      - shipping-and-launch
  agency:
    description: "Agency operating profile: product and growth delivery plus incremental implementation and disciplined Git handoffs. Pair with the relevant coding profile for implementation."
    extends:
