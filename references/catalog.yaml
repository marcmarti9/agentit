schema_version: 1
purpose: >-
  Mechanical, provenance-aware catalog of external references that Agentit can load after
  the primary AI has decided which domain/reference pack is useful. This catalog is not a
  natural-language router and does not turn social-media claims into facts.
policy:
  semantic_selection_owner: primary_ai
  software_role: mechanical_index_only
  prefer_primary_sources: true
  distinguish_creator_claims: true
  require_provenance_for_material_influence: true
  require_license_review_for_code_or_skill_reuse: true
  design_references_are_pattern_inspiration_not_clone_targets: true
  reverify_dynamic_sources_when_material: true
  default_project_ledger: docs/agentit/REFERENCES.md
  notes: |
    A reference may influence a decision without being authoritative evidence. The agent must
    preserve the distinction between a creator claim, an independently corroborated claim,
    canonical documentation, and a reusable licensed artifact. Load the smallest useful pack.
    If a source materially shapes architecture, product behavior, design, process, or a new
    dependency, record source -> extracted principle -> project decision -> affected paths in
    the project's reference ledger.

evidence_levels:
  canonical: "Official documentation, specification, or canonical repository for the thing being used."
  licensed_artifact: "Inspectable reusable artifact with a reviewed license; attribution may be required."
  corroborated: "Material claim supported by independent or multiple credible sources."
  creator_claim: "Claim made by the creator/vendor/post author; useful as a lead, not independent proof."
  inspiration: "Reference used for patterns/taste/ideas rather than factual authority."
  unverified: "Could not verify enough of the underlying claim; do not treat as evidence."

packs:
  engineering-discipline:
    description: "Small composable skills, inspect-first planning, bounded feedback loops, and harness/model separation."
    sources: [matt-pocock-skills, minchoi-senior-engineer, precisox-self-improving-agents, adiix-claude-router]
  web-design-studio:
    description: "Reference-first art direction, structural variety, implementable components, UX QA, motion, and premium visual storytelling."
    sources: [roundtable-reference-library, nett0eth-design-sources, fermin-checklist-design, ericksky-hallmark, monokern-21st-dev, midudev-liquid-ui, midudev-dark-transition, midudev-border-beam, heynavtoor-cinematic-web, xiathis-cinematic-web, csaba-oss-resources]
  growth-seo:
    description: "SEO/marketing work grounded in live data, specialized skills, and feedback loops rather than prompt dumps."
    sources: [bloggersarvesh-grok-seo, seijin-helena-mcp, cyril-fable-prompts, precisox-self-improving-agents]
  launch-content:
    description: "Research proven launch patterns, produce assets efficiently, distribute, measure, and learn."
    sources: [okara-launch-library, motion-product-video, jokker-youtube-pipeline, cyril-fable-prompts]
  build-vs-buy:
    description: "Search reusable infrastructure and approved tooling before inventing commodity functionality."
    sources: [chddaniel-chatpack, midudev-free-dev-resources, csaba-oss-resources, monokern-21st-dev]
  ai-systems-learning:
    description: "Deep model/inference knowledge and experimental local-model systems; useful for R&D rather than product claims."
    sources: [roh-anthropic-career, datachaz-colibri, adiix-claude-router]
  agency-economics:
    description: "Use AI to compress delivery cost while pricing around outcomes, scope, risk, craft, and market value—not tweet screenshots."
    sources: [bateshkaaa-premium-web, xiathis-cinematic-web, heynavtoor-cinematic-web]

