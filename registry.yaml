      - "${HOME}/.gemini/antigravity-cli/skills/supabase-postgres-best-practices"
    trigger: "Postgres query, schema, index, or database performance work"
    avoid_when: "non-database work"
    requires_signals_any: [postgres, postgresql, psql, supabase]
    context_cost: medium
    execution_cost: low
    depth: standard
    risk: high
