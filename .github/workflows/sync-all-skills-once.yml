name: Sync all canonical skills once

on:
  push:
    branches:
      - sync/all-skills-upstream-2026-09-04

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python3 -m pip install PyYAML

      - name: Preserve Agentit-owned pack map
        run: |
          test -f references/agentit-skill-packs.md
          cp references/agentit-skill-packs.md references/agentit-skill-packs.md

      - name: Sync canonical upstream packages
        run: |
          chmod +x scripts/sync-upstream-skills.sh
          ./scripts/sync-upstream-skills.sh

      - name: Reconcile Agentit routing and installers
        run: |
          python3 scripts/reconcile-upstream-skill-registry.py
          python3 scripts/align-canonical-skill-policy.py

      - name: Validate synchronized registry
        run: |
          bash -n scripts/sync-upstream-skills.sh scripts/sync-upstream-design-skills.sh install.sh update.sh security/harden-local.sh
          python3 -m unittest discover -s router -p 'test_*.py' -v
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          lock = json.loads((root / 'skills' / 'UPSTREAM_LOCK.json').read_text(encoding='utf-8'))
          assert len(lock['mappings']) >= 39
          assert (root / 'skills/impeccable/scripts/context.mjs').is_file()
          assert (root / 'skills/ui-ux-pro-max/scripts').is_dir()
          assert (root / 'skills/ui-ux-pro-max/data').is_dir()
          assert (root / 'skills/humanizer/scripts').is_dir()
          assert (root / 'skills/stop-slop/references').is_dir()
          assert (root / 'skills/appllama-app-design-skill/references').is_dir()
          assert (root / 'skills/diagram-design/SKILL.md').is_file()
          assert (root / 'references/definition-of-done.md').is_file()
          PY

      - name: Commit synchronized registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m 'feat: sync complete canonical upstream skill registry'
          git push origin "HEAD:${GITHUB_REF_NAME}"
