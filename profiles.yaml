schema_version: 1
default_profile: core
global_profiles:
- core
profiles:
  core:
    description: 'Minimal global Agentit bootstrap: decide whether Agentit is warranted, choose a
      domain pack, then load task skills JIT. Core also carries the minimum durable-documentation
      and cold-session invariants.'
    skills:
    - using-agentit
    - task-router
    - using-agent-skills
  frontend:
    description: Core plus browser, performance, UI maintenance, and development-security guidance.
      Installation/discovery only; runtime selection remains JIT, but security implications are part
      of the standing development bar and app-security-gate becomes mandatory when the change exposes
      or modifies a meaningful application attack surface.
    extends:
    - core
    skills:
    - frontend-ui-engineering
    - react-composition-patterns
    - browser-testing-with-devtools
    - performance-optimization
    - code-simplification
    - anti-overengineering
    - constraint-driven-development
    - security-and-hardening
    - app-security-gate
    - hallmark
    - design-taste-frontend
    - specialist-agent-routing
    - property-based-testing
    - security-analysis
  backend:
    description: Core plus API boundaries, observability, service maintenance, and development-security
      guidance. Installation/discovery only; runtime selection remains JIT, but security implications
      are part of the standing development bar and app-security-gate becomes mandatory for material
      auth/API/data/admin/deploy surfaces.
    extends:
    - core
    skills:
    - api-and-interface-design
    - mcp-server-development
    - observability-and-instrumentation
    - performance-optimization
    - code-simplification
    - anti-overengineering
    - constraint-driven-development
    - security-and-hardening
    - app-security-gate
    - property-based-testing
    - security-analysis
    - data-analysis-quality
  supabase:
    description: Backend profile plus PostgreSQL/Supabase-specific guidance.
    extends:
    - backend
    skills:
    - supabase-postgres-best-practices
  product:
    description: Core plus discovery, adversarial ideation, marketing, CRO, and product decision support.
    extends:
    - core
    skills:
    - idea-refine
    - adversarial-idea-review
    - interview-me
    - documentation-and-adrs
