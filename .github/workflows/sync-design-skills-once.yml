name: Sync design skills once

on:
  push:
    branches:
      - sync/design-skills-upstream-2026-09-04

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vendor canonical upstream packages
        run: |
          chmod +x scripts/sync-upstream-design-skills.sh
          ./scripts/sync-upstream-design-skills.sh

      - name: Integrate canonical package names and multifile skills
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          vendored = {
              Path('skills/design-taste-frontend'),
              Path('skills/impeccable'),
              Path('skills/emil-design-eng'),
          }

          def inside_vendored(path: Path) -> bool:
              return any(base == path or base in path.parents for base in vendored)

          text_suffixes = {'.md', '.yaml', '.yml', '.py', '.json', '.sh', '.toml', '.txt'}
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or inside_vendored(path):
                  continue
              if path.suffix not in text_suffixes and path.name != 'agentit':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if 'impeccable-design' in text:
                  path.write_text(text.replace('impeccable-design', 'impeccable'), encoding='utf-8')

          profiles = Path('router/profiles.py')
          text = profiles.read_text(encoding='utf-8')
          pattern = re.compile(
              r'def _list_skill_package_files\(skill_dir: Path\) -> list\[str\]:\n'
              r'.*?\n    return files\n\n',
              re.S,
          )
          replacement = '''def _list_skill_package_files(skill_dir: Path) -> list[str]:
              """Return SKILL.md plus every regular file contained in the skill package."""
              if not skill_dir.is_dir() or skill_dir.is_symlink():
                  raise ProfileError(f"skill directory is not a regular directory: {skill_dir}")
              skill_md = skill_dir / "SKILL.md"
              if not skill_md.is_file() or skill_md.is_symlink():
                  raise ProfileError(f"source skill is not a regular file: {skill_md}")
              files = ["SKILL.md"]
              for path in sorted(skill_dir.rglob("*")):
                  if path.is_symlink():
                      raise ProfileError(f"skill package rejects symlinks: {path}")
                  if path.is_file() and path != skill_md:
                      files.append(path.relative_to(skill_dir).as_posix())
              return files

          '''
          replacement = '\n'.join(line[14:] if line.startswith('              ') else line for line in replacement.splitlines()) + '\n'
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('could not replace _list_skill_package_files exactly once')
          profiles.write_text(text, encoding='utf-8')

          notices = Path('THIRD_PARTY_NOTICES.md')
          text = notices.read_text(encoding='utf-8')
          text = text.replace(
              'Agentit materially modifies and integrates the design-taste guidance into its provider-neutral routing/profile model.',
              'Agentit vendors the canonical upstream `skills/taste-skill` package as `skills/design-taste-frontend` without compressing or rewriting its skill body. Agentit-specific routing and composition live outside the vendored package.',
          )
          text = text.replace(
              'Agentit adapts the public design-engineering philosophy for its local `emil-design-eng` skill.',
              'Agentit vendors the canonical upstream `skills/emil-design-eng` package as `skills/emil-design-eng` without compressing or rewriting its skill body. Agentit-specific routing and composition live outside the vendored package.',
          )
          text = text.replace(
              "Agentit's `impeccable` is a substantially reorganized/modified adaptation for Agentit's skill model. It does not vendor Impeccable's scripts, detector, CLI, or claim drop-in compatibility with its command runtime.",
              "Agentit vendors Impeccable's canonical `.agents/skills/impeccable` distribution as `skills/impeccable`, including its `SKILL.md`, `reference/`, and `scripts/` package files. Agentit-specific routing and composition live outside the vendored package.",
          )
          notices.write_text(text, encoding='utf-8')

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text(encoding='utf-8')
          text = text.replace(
              'bash -n install.sh update.sh security/harden-local.sh',
              'bash -n install.sh update.sh security/harden-local.sh scripts/sync-upstream-design-skills.sh',
          )
          ci.write_text(text, encoding='utf-8')
          PY

      - name: Add package coverage tests
        run: |
          cat > router/test_skill_packages.py <<'PY'
          import tempfile
          import unittest
          from pathlib import Path

          from router.profiles import ProfileError, _list_skill_package_files, load_catalog, resolve_profile


          class SkillPackageTests(unittest.TestCase):
              def test_package_discovery_includes_all_regular_files(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      skill = Path(tmp) / 'skill'
                      (skill / 'reference').mkdir(parents=True)
                      (skill / 'scripts').mkdir()
                      (skill / 'assets' / 'nested').mkdir(parents=True)
                      (skill / 'SKILL.md').write_text('# skill\n', encoding='utf-8')
                      (skill / 'reference' / 'audit.md').write_text('audit\n', encoding='utf-8')
                      (skill / 'scripts' / 'context.mjs').write_text('export {};\n', encoding='utf-8')
                      (skill / 'assets' / 'nested' / 'fixture.txt').write_text('fixture\n', encoding='utf-8')

                      self.assertEqual(
                          _list_skill_package_files(skill),
                          [
                              'SKILL.md',
                              'assets/nested/fixture.txt',
                              'reference/audit.md',
                              'scripts/context.mjs',
                          ],
                      )

              def test_package_discovery_rejects_symlinks(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      skill = Path(tmp) / 'skill'
                      skill.mkdir()
                      (skill / 'SKILL.md').write_text('# skill\n', encoding='utf-8')
                      target = skill / 'real.txt'
                      target.write_text('real\n', encoding='utf-8')
                      link = skill / 'linked.txt'
                      try:
                          link.symlink_to(target.name)
                      except (OSError, NotImplementedError):
                          self.skipTest('symlinks unavailable on this platform')
                      with self.assertRaises(ProfileError):
                          _list_skill_package_files(skill)

              def test_design_profile_uses_canonical_impeccable_package(self):
                  root = Path(__file__).resolve().parents[1]
                  catalog = load_catalog(root / 'profiles.yaml')
                  skills = resolve_profile('design', catalog, repo_root=root)
                  self.assertIn('design-taste-frontend', skills)
                  self.assertIn('impeccable', skills)
                  self.assertIn('emil-design-eng', skills)
                  self.assertNotIn('impeccable-design', skills)
                  self.assertTrue((root / 'skills' / 'impeccable' / 'reference').is_dir())
                  self.assertTrue((root / 'skills' / 'impeccable' / 'scripts').is_dir())


          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Validate synced tree
        run: |
          python3 -m pip install PyYAML
          bash -n scripts/sync-upstream-design-skills.sh
          python3 -m unittest discover -s router -p 'test_*.py' -v
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 - <<'PY'
          from pathlib import Path
          assert not Path('skills/impeccable-design').exists()
          assert len(Path('skills/design-taste-frontend/SKILL.md').read_text(encoding='utf-8')) > 80000
          assert len(Path('skills/emil-design-eng/SKILL.md').read_text(encoding='utf-8')) > 25000
          assert 'version: 4.1.3' in Path('skills/impeccable/SKILL.md').read_text(encoding='utf-8')
          assert any(Path('skills/impeccable/reference').rglob('*.md'))
          assert any(Path('skills/impeccable/scripts').rglob('*'))
          PY

      - name: Commit synchronized packages
        run: |
          rm -f .github/workflows/sync-design-skills-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m 'feat: sync complete upstream design skills'
          git push origin "HEAD:${GITHUB_REF_NAME}"
