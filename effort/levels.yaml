schema_version: 2
policy:
  # Craft depth (standard/polished/studio) applies ONLY to visual/design work.
  # It is NOT a universal product-work effort tax.
  craft_depth_design_only: true
  interview_required_for_product_work: true
  mechanical_bypass_allowed: true
  token_estimates_are_project_aware: true
  fixed_token_ranges_are_not_authoritative: true
  provider_neutral: true
  intelligent_delegation: true
  no_hard_subagent_caps: true
  critic_required_for_large_structural_plans: true
  activation_phrase_only: true
  notes: |
    Domain pack chooses which skill family and MCP stack to load (profiles.yaml).
    Craft depth (standard/polished/studio) is design/visual only.
    Optional spend posture (lean/normal/thorough) is soft thoroughness for the main agent,
    not a multi-agent quota and not a fixed token bill.
    Token ranges are estimated per task/project signals by the router; catalog ranges
    below are non-authoritative reference only for design craft depth.
    Activation: any natural "use/usa/... agentit" (or equivalent in the user's language).
    No other powerwords are required. Natural task language drives routing.

mechanical_bypass:
  description: Purely mechanical work that saves user time without making or changing a product decision.
  examples:
    - create explicitly named directories or files
    - move or rename files exactly as instructed
    - run an explicitly requested command or test
    - apply deterministic formatting
    - copy exact content between known locations
  never_bypass_when:
    - choosing UX or visual behavior
    - changing product functionality
    - making architecture or API decisions
    - choosing wording, positioning, or content strategy
    - choosing implementation tradeoffs with user-visible consequences
    - creating a new product, feature, page, workflow, or design

domain_packs:
  engineering:
    profiles: [core]
    skill_families: [engineering, verification]
  frontend:
    profiles: [frontend]
    skill_families: [frontend, verification]
  design:
    profiles: [design]
    skill_families: [design, frontend, verification]
    craft_depth_applies: true
  backend:
    profiles: [backend]
    skill_families: [backend, verification]
  data:
    profiles: [supabase]
    skill_families: [database, backend, verification]
  product:
    profiles: [product]
    skill_families: [product, verification]
  writing:
    profiles: [writing]
    skill_families: [writing, verification]
  release:
    profiles: [release]
    skill_families: [release, verification]
  research:
    profiles: [research]
    skill_families: [research, verification]
  role_custom:
    profiles: []
    skill_families: [role_scoped]
    notes: User-assigned role loads matching domain skills plus always_core only.

always_core_skills:
  - using-agentit
  - architect-orchestrator
  - using-agent-skills
  - task-router
  - long-horizon-recovery
  - mcp-tooling-fit
  - verification-before-completion
  - verification-gauntlet

spend_postures:
  lean:
    label: Lean
    intent: Minimum thoroughness that still ships correct, verified work.
    research: only blocking facts
    iteration: 1 focused verification cycle when possible
  normal:
    label: Normal
    intent: Proportionate research, plan, and verification for ordinary work.
    research: when it improves a real decision
    iteration: 1-2 verification/fix cycles
  thorough:
    label: Thorough
    intent: Extra research, edge cases, and review when the task justifies it.
    research: broader when uncertainty or risk is high
    iteration: multiple critique/fix cycles when useful

# Design/visual craft depth ONLY — not used for backend, infra, pure logic, etc.
craft_depth:
  standard:
    label: Standard
    applies_to: design_visual
    intent: Clean production UI without broad exploration.
    result_expectation: Correct, usable, maintainable visual work without premium concept passes.
    reference_token_hint: "project-aware; often modest for small UI changes"
    relative_cost: "1x design baseline"
    research: only when facts or current patterns are needed
    specialists: when isolation or critique clearly helps
    concept_exploration: none or one direct approach
    visual_qa: basic rendered check
  polished:
    label: Polished
    applies_to: design_visual
    intent: Stronger visual/interaction quality with targeted research and review.
    result_expectation: Better hierarchy, states, responsive behavior, and polish than Standard.
    reference_token_hint: "project-aware; higher when browser loops and critique run"
    relative_cost: "2-5x design Standard"
    research: targeted when it improves the design decision
    specialists: useful for research, critique, or independent visual QA
    concept_exploration: compare approaches when the choice matters
    visual_qa: desktop + mobile + interaction/state review
  studio:
    label: Studio
    applies_to: design_visual
    intent: Quality-first visual work where concept and craft dominate cost.
    result_expectation: Best reasonable visual result under constraints; critique and iteration welcome.
    reference_token_hint: "project-aware; can be large for flagship surfaces"
    relative_cost: "5-15x+ design Standard"
    research: broad and current when relevant
    specialists: fan-out/competition/critique when concept quality matters
    concept_exploration: multiple distinct directions when useful
    visual_qa: full responsive/motion/accessibility/performance critique

# Backward-compatible alias: older docs/tests referred to "levels" as Standard/Polished/Studio.
# Those now mean craft_depth for design only.
levels:
  standard:
    label: Standard
    intent: Efficient production-quality visual/design execution.
    result_expectation: "Correct, clean, maintainable design work without broad exploration."
    typical_total_token_range: "project-aware estimate (not a fixed bill)"
    relative_cost: "1x"
    research: only when facts or current information are needed
    interview: confirm craft depth only for design/visual tasks
    specialists: intelligent spawn when beneficial; no hard quota
    concept_exploration: "none or one direct approach"
    implementation_iterations: "focused verification/fix cycles"
    visual_qa: "basic rendered check when UI changes"
    recommended_for:
      - ordinary UI fixes and components
      - straightforward pages without flagship craft needs
  polished:
    label: Polished
    intent: Higher design craft with targeted research and review.
    result_expectation: "Stronger visual/interaction polish and broader visual QA than Standard."
    typical_total_token_range: "project-aware estimate (not a fixed bill)"
    relative_cost: "2-5x Standard design baseline"
    research: targeted research when it improves design decisions
    interview: craft depth for design/visual tasks
    specialists: intelligent spawn when beneficial; critic for large plans
    concept_exploration: "compare approaches when the choice matters"
    implementation_iterations: "multiple critique/fix cycles when useful"
    visual_qa: "desktop + mobile + interaction/state review"
    recommended_for:
      - public-facing product UI
      - portfolio-worthy visual work
      - important redesigns
  studio:
    label: Studio
    intent: Quality-first flagship visual work.
    result_expectation: "Best reasonable visual result: research, concepts, critique, extensive polish."
    typical_total_token_range: "project-aware estimate (not a fixed bill)"
    relative_cost: "5-15x+ Standard design baseline"
    research: broad and current when relevant
    interview: craft depth for design/visual tasks
    specialists: competition/fan-out/critique when concept quality matters
    concept_exploration: "multiple distinct directions when useful"
    implementation_iterations: "iterate until remaining gains are marginal"
    visual_qa: "full responsive/motion/accessibility/performance critique"
    recommended_for:
      - flagship personal or company websites
      - premium creative experiences
      - high-stakes visual launches

selection_protocol:
  required_interview_question: true
  craft_depth_question_only_for_design_visual: true
  recommendation_required: true
  must_explain:
    - why the recommended domain pack fits the task
    - for design/visual work, why the recommended craft depth fits
    - project-aware rough token estimate and what drives it
    - whether independent critique or specialists are planned
  user_must_confirm_level: false
  user_must_confirm_craft_depth_for_design: true
  explicit_user_override_allowed: true
  do_not_pretend_precision: true
  no_powerwords_required: true
  activation_only_trigger: "natural use/usa/utilise/... agentit (any language)"
  escalation_during_execution:
    rule: Ask before materially expanding scope or spend posture unless safety/correctness requires it.
    example: "This is larger than expected. Staying lean means X; thorough adds roughly Y estimated tokens for Z. Which do you want?"
