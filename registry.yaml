schema_version: 1
purpose: >-
  Portable inventory of Agentit-owned components and optional host adapters.
  Machine observations, installed third-party tools, endpoints, credentials and
  mutable runtime state belong in ignored local state, never in this catalog.

providers:
  - id: codex-cli
    executable_names: [codex]
    target_roots: ["${HOME}/.codex"]
    expected_status: AVAILABLE_ON_DEMAND
  - id: claude-code
    executable_names: [claude]
    target_roots: ["${HOME}/.claude"]
    expected_status: AVAILABLE_ON_DEMAND
  - id: gemini-cli
    executable_names: [gemini]
    target_roots: ["${HOME}/.gemini"]
    expected_status: AVAILABLE_ON_DEMAND
  - id: portable-agents
    executable_names: []
    target_roots: ["${HOME}/.agents"]
    expected_status: AVAILABLE_ON_DEMAND

entries:
  - id: agentit-core-bootstrap
    kind: skill-set
    category: orchestration
    provenance: local-repository
    paths:
      - "${REPO_ROOT}/skills/using-agentit/SKILL.md"
      - "${REPO_ROOT}/skills/task-router/SKILL.md"
      - "${REPO_ROOT}/skills/using-agent-skills/SKILL.md"
    state: ACTIVE_GLOBAL

  - id: semantic-pack-map
    kind: reference
    category: context
    provenance: local-repository
    paths:
      - "${REPO_ROOT}/skills/using-agent-skills/references/packs.md"
      - "${REPO_ROOT}/profiles.yaml"
    state: AVAILABLE_ON_DEMAND

  - id: reference-intelligence
    kind: skill-and-references
    category: research
    provenance: local-repository
    paths:
      - "${REPO_ROOT}/skills/reference-intelligence/SKILL.md"
      - "${REPO_ROOT}/references/INDEX.md"
    state: AVAILABLE_ON_DEMAND

  - id: specialist-catalog
    kind: capability-catalog
    category: delegation
    provenance: local-repository
    paths:
      - "${REPO_ROOT}/agents/catalog.yaml"
      - "${REPO_ROOT}/skills/specialist-agent-routing/SKILL.md"
    state: AVAILABLE_ON_DEMAND

  - id: worker-context-contract
    kind: runtime
    category: delegation
    provenance: local-repository
    paths:
      - "${REPO_ROOT}/router/worker_context.py"
      - "${REPO_ROOT}/docs/CAPABILITIES.md"
    state: AVAILABLE_ON_DEMAND

  - id: capability-resolution
    kind: runtime
    category: permissions
    provenance: local-repository
    paths:
      - "${REPO_ROOT}/capabilities/catalog.yaml"
      - "${REPO_ROOT}/router/capabilities.py"
    state: AVAILABLE_ON_DEMAND

  - id: loop-graph-runtime
    kind: runtime
    category: execution
    provenance: local-repository
    paths:
      - "${REPO_ROOT}/router/loop_runtime.py"
      - "${REPO_ROOT}/router/graph_runtime.py"
      - "${REPO_ROOT}/docs/RUNTIME_ENGINEERING.md"
    state: AVAILABLE_ON_DEMAND

  - id: verification-runtime
    kind: runtime-and-skills
    category: verification
    provenance: local-repository
    paths:
      - "${REPO_ROOT}/router/verify.py"
      - "${REPO_ROOT}/skills/verification-before-completion/SKILL.md"
      - "${REPO_ROOT}/skills/verification-gauntlet/SKILL.md"
    state: AVAILABLE_ON_DEMAND

  - id: private-continuity
    kind: runtime-and-skill
    category: continuity
    provenance: local-repository
    paths:
      - "${REPO_ROOT}/router/continuity.py"
      - "${REPO_ROOT}/skills/long-horizon-recovery/SKILL.md"
      - "${REPO_ROOT}/docs/PROJECT_CONTINUITY.md"
    state: AVAILABLE_ON_DEMAND

  - id: mcp-runtime
    kind: runtime
    category: tooling
    provenance: local-repository
    paths:
      - "${REPO_ROOT}/mcp/catalog.yaml"
      - "${REPO_ROOT}/mcp/gateway.py"
      - "${REPO_ROOT}/router/mcp_catalog.py"
      - "${REPO_ROOT}/router/mcp_runtime.py"
      - "${REPO_ROOT}/router/mcp_providers.py"
    state: AVAILABLE_ON_DEMAND

  - id: scout-runtime
    kind: runtime
    category: discovery
    provenance: local-repository
    paths:
      - "${REPO_ROOT}/router/scout.py"
    state: AVAILABLE_ON_DEMAND

  - id: codex-worker-adapter
    kind: host-adapter
    category: delegation
    provenance: local-repository
    paths:
      - "${REPO_ROOT}/.codex/agents/luna-worker.toml"
      - "${REPO_ROOT}/.codex/agents/terra-worker.toml"
      - "${REPO_ROOT}/CODEX.md"
    state: AVAILABLE_ON_DEMAND

  - id: claude-host-adapter
    kind: host-adapter
    category: orchestration
    provenance: local-repository
    paths:
      - "${REPO_ROOT}/CLAUDE.md"
    state: AVAILABLE_ON_DEMAND
