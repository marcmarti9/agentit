version: 1
candidates:
- id: nanonets-graft
  source: https://github.com/NanoNets/Graft
  claim: Structural and conceptual codebase knowledge graph using Tree-sitter and
    Markdown
  type: context_provider
  status: validated
  integration_mode: optional_external
  benefits:
  - 46% fewer tool calls
  - 42% fewer tokens
  - Persistent structural context across sessions
  costs:
  - Node.js dependency
  - Local graph storage
  risks:
  - Stale generated graph if git changes without re-indexing
  decision: integrate_as_provider
  evidence: Verified official repository and multi-agent MCP integration
- id: claude-company-skills
  source: https://x.com/seeconvm
  claim: 40+ skills grouped by departments (Engineering, Design, Marketing, Legal)
  type: profile_catalog
  status: evaluated
  integration_mode: on_demand_profiles
  benefits:
  - Clear UX hierarchy for non-technical users
  - Comprehensive domain coverage
  costs:
  - High context budget noise if globally active
  risks:
  - Discovery token overhead
  decision: map_to_on_demand_profiles
  evidence: Curated into product, writing, design on-demand profiles
- id: test_idea
  source: https://x.com/test_idea
  claim: Scouted ecosystem idea/tool
  type: evaluated_idea
  status: incubating
  decision: pending_evaluation
- id: mcp-community-core-2026
  source: https://www.reddit.com/r/mcp/
  claim: Consensus coding MCP stack Context7 + GitHub + Playwright (+ Figma/Supabase situational)
  type: mcp_catalog
  status: validated
  integration_mode: optional_external
  benefits:
  - Live docs reduce hallucinated APIs
  - Repo/PR context without copy-paste
  - Browser verification for UI work
  costs:
  - Token/tool surface growth per server
  - Secrets and OAuth management per client
  risks:
  - Write-capable MCP against production data or repos
  - Supply-chain risk of unpinned npx packages
  decision: integrate_as_catalog
  evidence: Curated into mcp/catalog.yaml; CLI agentit mcp; docs/MCP_CATALOG.md; no auto-activate
- id: taste-skill-design-frontend
  source: https://github.com/Leonxlnx/taste-skill
  claim: Dense anti-slop frontend skill for landings, portfolios, redesigns (dials, AI tells, pre-flight)
  type: skill
  status: validated
  integration_mode: on_demand_profiles
  benefits:
  - Brief inference + variance/motion/density dials before code
  - Production-tested AI visual tells beyond short anti-slop checklists
  - Progressive disclosure fit for Agentit token budgets
  costs:
  - Upstream SKILL.md is huge if imported raw (~80k+ chars)
  - Opinionated stack/motion defaults need local adaptation
  risks:
  - Over-application to dashboards or product chrome
  - Context noise if promoted to core profile
  decision: integrate_as_curated_skill
  evidence: Slim skill skills/design-taste-frontend with references/; design+frontend profiles; router recommends for design/marketing; hallmark placeholder archived
- id: arcads-marketing-os
  source: https://x.com/rom1trs/status/2089692842708938829
  claim: One Claude skill packing a six-role marketing department with explicit handoffs
    (Head of Marketing, Copywriter, Creative Strategist, Launch Lead, SEO Lead, Analyst)
  type: skill
  status: incubating
  integration_mode: on_demand_profiles
  benefits:
  - Role-specialized marketing loops that map to Pipeline / Writer-Reviewer topologies
  - Complements existing marketing-and-growth without replacing it
  - Progressive disclosure fit if split into atomic skills under a product/growth profile
  costs:
  - Public artifact still gated (comment "OS" for setup); license and size unknown
  - Likely Claude-first packaging; needs a provider-neutral SKILL.md slim
  - Risk of overlap and discovery noise with marketing-and-growth
  risks:
  - Vendor coupling to Arcads ads stack or paid APIs
  - Unbounded multi-role context if imported as one mega-skill
  - Cannot vendor or register until files, license, and attribution are inspectable
  decision: hold_for_public_artifact_then_curate
  evidence: Launch post 2026-08-18 describes role tree and Analyst to Copywriter to Strategist to Analyst loop; no public repo or SKILL.md located; do not promote to registry until artifact review
- id: coreyhaines-marketingskills
  source: https://github.com/coreyhaines31/marketingskills
  claim: Full open-source marketing skill pack (CRO, copy, SEO, paid, analytics, retention)
  type: skill_bundle
  status: validated
  integration_mode: on_demand_profiles
  benefits:
  - Shared product-marketing context across skills
  - Broad agency coverage without inventing playbooks from scratch
  - Already referenced in registry as marketingskills (not-installed)
  costs:
  - Dozens of skills; must selective-install to protect token budgets
  - Overlap with in-repo marketing-and-growth and optional pm-skills
  risks:
  - Global install discovery noise
  - Upstream opinionated SaaS-growth defaults may not fit every client
  decision: integrate_as_on_demand_bundle
  evidence: Community gold standard 2026; Agentit registry already lists id marketingskills
- id: hyperfx-marketing-skills
  source: https://github.com/hyperfx-ai/marketing-skills
  claim: Marketing skills oriented to execution across ads/social with Hyper MCP tools
  type: skill_bundle
  status: evaluated
  integration_mode: optional_external
  benefits:
  - Complements Corey strategy layer with execution-oriented workflows
  - Pairs with live ad-platform tool access when Hyper MCP is enabled
  costs:
