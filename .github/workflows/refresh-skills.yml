name: Refresh Agentit upstream skills

on:
  push:
    branches:
      - refresh/tasteskill-skills-2026-10-15
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/refresh/tasteskill-skills-2026-10-15'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout refresh branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install local test dependency
        run: python3 -m pip install 'PyYAML>=6,<7'

      - name: Resolve HEADs and build a read-only refresh plan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_upstream_skills.py --refresh > "$RUNNER_TEMP/agentit-refresh-plan.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "agentit-refresh-plan.json").read_text())
          assert plan["status"] == "plan"
          (Path(os.environ["RUNNER_TEMP"]) / "agentit-resolved-heads.json").write_text(
              json.dumps(plan["source_commits"], indent=2) + "\n"
          )
          print("Planned", plan["packages"], "canonical packages from", len(plan["source_commits"]), "verified commit IDs")
          PY

      - name: Apply exactly the inspected HEADs from cached snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_upstream_skills.py \
            --refresh --offline \
            --heads-file "$RUNNER_TEMP/agentit-resolved-heads.json" \
            --apply
          python3 scripts/sync_upstream_skills.py

      - name: Validate catalog, ownership, and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_skill_curation.py
          python3 scripts/ecc_integrate.py
          python3 -m unittest discover -s router -p 'test_*.py'
          python3 -m unittest discover -s tests -p 'test_*.py'
          git diff --check
          git diff --exit-code -- AGENTS.md skills/using-agentit skills/task-router skills/using-agent-skills

      - name: Commit validated refresh to this review branch only
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- skills vendor/licenses vendor/agent-skills references
          if git diff --cached --quiet; then
            echo "No changed managed packages"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(skills): refresh pinned upstream skills"
          git push origin "HEAD:$GITHUB_REF_NAME"
