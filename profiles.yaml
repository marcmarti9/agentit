schema_version: 1
default_profile: core
global_profiles:
  - core
profiles:
  core:
    description: "Minimal global Agentit bootstrap: decide whether Agentit is warranted, choose a domain pack, then load task skills JIT. Core also carries the minimum durable-documentation and cold-session invariants."
    skills:
      - using-agentit
      - task-router
      - using-agent-skills
  frontend:
    description: "Core plus browser, performance, and UI maintenance guidance. Installation/discovery only; runtime selection remains JIT."
    extends:
      - core
    skills:
      - frontend-ui-engineering
      - browser-testing-with-devtools
      - performance-optimization
      - code-simplification
      - anti-ai-slop-design
      - design-taste-frontend
      - specialist-agent-routing
  backend:
    description: "Core plus API boundaries, observability, and service maintenance. Installation/discovery only; runtime selection remains JIT."
    extends:
      - core
    skills:
      - api-and-interface-design
      - observability-and-instrumentation
      - performance-optimization
      - code-simplification
  supabase:
    description: "Backend profile plus PostgreSQL/Supabase-specific guidance."
    extends:
      - backend
    skills:
      - supabase-postgres-best-practices
  product:
    description: "Core plus discovery, marketing, CRO, and product decision support."
    extends:
      - core
    skills:
      - idea-refine
      - interview-me
      - documentation-and-adrs
      - spec-driven-development
      - marketing-and-growth
      - verification-before-completion
  writing:
    description: "Technical writing, documentation, and anti-AI-slop editing."
    extends:
      - core
    skills:
      - documentation-and-adrs
      - anti-ai-slop-writing
  design:
    description: "Craft-first design studio profile. Runtime workers still load only the selected design pack skills JIT; this profile is an installation/discovery bundle, not a context bundle."
    extends:
      - frontend
    skills:
      - anti-ai-slop-design
      - ui-ux-pro-max-intelligence
      - design-taste-frontend
      - impeccable-design
      - emil-design-eng
      - design-inspiration-research
      - design-md-workflow
      - diagram-and-architecture-visuals
